<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Borjomi — Energia и Limonati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@600;700;800&family=Fira+Sans:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f7f6; --surface:#ffffff; --ink:#0f2f3a; --muted:#52707a; --line:#d5e2e0;
  --green:#0f6b66; --deer:#8a2342; --chip:#e4f0ee; --chip-ink:#0f5450;
  --head:"Fira Sans Condensed","Arial Narrow",sans-serif; --body:"Fira Sans",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0c1d22;--surface:#142b31;--ink:#eaf4f2;--muted:#9bb6bb;--line:#264249;--green:#5cc3bb;--deer:#ee7c98;--chip:#1d3a40;--chip-ink:#a6e3dc;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0c1d22;--surface:#142b31;--ink:#eaf4f2;--muted:#9bb6bb;--line:#264249;--green:#5cc3bb;--deer:#ee7c98;--chip:#1d3a40;--chip-ink:#a6e3dc;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{padding:56px 0 28px}
h1{font-family:var(--head);font-weight:800;font-size:clamp(40px,7vw,76px);line-height:.98;margin:0 0 14px;letter-spacing:-.01em;max-width:14ch}
header p{margin:0;max-width:52ch;color:var(--muted);font-size:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0 28px}
.tabs button{font:600 16px var(--head);letter-spacing:.02em;padding:10px 20px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button[aria-pressed="true"]{color:#06201e}}
.tabs button:focus-visible,.card a:focus-visible{outline:3px solid var(--deer);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;padding-bottom:72px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.card[hidden]{display:none}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:50% 45%;display:block}
.body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.line{font:600 14px var(--body);color:var(--deer)}
h2{font-family:var(--head);font-weight:700;font-size:26px;line-height:1.1;margin:0}
.body p{margin:0;color:var(--muted);font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:10px}
.tags span{background:var(--chip);color:var(--chip-ink);font-size:13px;font-weight:500;padding:4px 10px;border-radius:999px}
footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--muted);font-size:14px}
</style>
</head>

</header>

const grid=document.getElementById('grid');
products.forEach(p=>{
  const el=document.createElement('article');
  el.className='card';el.dataset.line=p.line;
  el.innerHTML='<img alt="Банка '+p.line+' '+p.name+'" loading="lazy" src="'+p.img+'">'+
   '<div class="body"><div class="line">'+p.line+' by Borjomi</div><h2>'+p.name+'</h2><p>'+p.desc+'</p>'+
   '<div class="tags">'+p.tags.map(t=>'<span>'+t+'</span>').join('')+'</div></div>';
  grid.appendChild(el);
});
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  grid.querySelectorAll('.card').forEach(c=>c.hidden=b.dataset.f!=='all'&&c.dataset.line!==b.dataset.f);
}));
</script>
