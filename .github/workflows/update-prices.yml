name: Обновление запасных цен
on:
  schedule:
    - cron: "17 0 * * *"   # 00:17 UTC = 05:17 по Алматы, до утренней проверки таблицы (~06:00)
  workflow_dispatch:
    inputs:
      force:
        description: "Обновить, даже если товаров или цен стало заметно меньше"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
concurrency:
  group: update-prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Скачать таблицу и обновить prices.csv
        id: upd
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
        run: python3 tools/update_prices.py
      - name: Сохранить изменения
        if: steps.upd.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.csv
          git commit -m "Обновление запасных цен из таблицы ($(TZ=Asia/Almaty date +%d.%m.%Y))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Запросить пересборку сайта (если не запустилась сама)
        if: steps.upd.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Пересборку Pages запросить не удалось, обычно она идёт сама"
